<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vector Defender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background-color: #000;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        #mobile-controls {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="mobile-controls" class="d-block d-sm-none">
        <div class="row">
            <div class="col-4">
                <button id="left-btn" class="btn btn-primary w-100 h-100">Left</button>
            </div>
            <div class="col-4">
                <button id="right-btn" class="btn btn-primary w-100 h-100">Right</button>
            </div>
            <div class="col-4">
                <button id="fire-btn" class="btn btn-danger w-100 h-100">Fire</button>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-6">
                <button id="up-btn" class="btn btn-primary w-100 h-100">Up</button>
            </div>
            <div class="col-6">
                <button id="down-btn" class="btn btn-primary w-100 h-100">Down</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
